<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="index, follow">
  <title>Repos — KaioHSG.Dev</title>
  <link rel="stylesheet" href="/assets/css/global.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="/favicon.ico">
</head>
<body>
  <div id="container">
    <div class="top-nav">
      <a href="/">Home</a>
      <span class="top-nav-sep">|</span>
      <a href="/repos/">Repos</a>
      <span class="top-nav-sep">|</span>
      <a href="https://github.com/KaioHSG" target="_blank" rel="noopener">GitHub</a>
    </div>

    <div id="loading">
      <p>Loading repositories…</p>
      <p><span class="loading-dot">.</span><span class="loading-dot">.</span><span class="loading-dot">.</span></p>
    </div>

    <div id="error" class="hidden">
      <h1>:(</h1>
      <p>Could not load data from GitHub.</p>
      <a href="./" class="btn-retro">Try again</a>
    </div>

    <div id="repo-list" class="hidden">
      <h1 class="center">Repos</h1>
      <p class="subtitle center">Projects, experiments &amp; random stuff on GitHub</p>
      <div class="filter-bar">
        <input type="text" id="repo-search" placeholder="Search repos..." autocomplete="off">
        <select id="filter-lang"><option value="">All languages</option></select>
        <select id="filter-sort">
          <option value="updated">Recent</option>
          <option value="stars">Most stars</option>
          <option value="forks">Most forks</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <div class="repo-grid"></div>
      <p id="repo-count" class="hidden"></p>
    </div>

    <div id="repo-view" class="hidden">
      <div class="repo-header">
        <p class="repo-breadcrumb"><a href="./">← All repos</a></p>
        <h1 class="repo-title"></h1>
        <div class="repo-actions"></div>
      </div>

      <div id="markdown-content"></div>

      <div id="releases" class="release-section hidden">
        <h3><a id="release-heading" href="">📦 Releases</a></h3>
        <div class="release-list"></div>
      </div>

      <p class="repo-footer"><a href="./">← Back to all repos</a></p>
    </div>

    <footer>
      <p><a href="/copypasta.txt">2026 Kaio HSG</a></p>
    </footer>
  </div>

  <script src="repo-tree/main.js"></script>
</body>
</html>
